<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Master Driving Academy v88</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;margin:0;background:#f5f7fa;color:#15263a}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .card{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:22px;max-width:520px;box-shadow:0 4px 18px rgba(16,45,76,.08)}
    .title{font-size:22px;font-weight:900;color:#123b63;margin-bottom:8px}
    .sub{color:#6f7d8a;line-height:1.8}
    .err{color:#a12e2e;margin-top:12px}
  </style>
</head>
<body>
<div class="loading">
  <div class="card">
    <div class="title">Master Driving Academy v88</div>
    <div class="sub">جاري تحميل النسخة وإصلاح حفظ المصروفات...</div>
    <div id="err" class="err"></div>
  </div>
</div>

<script>
(async function(){
  try{
    const sourceUrl = 'https://raw.githubusercontent.com/tareknt-alt/Master-Driving-Academy-app/main/index.html';
    const res = await fetch(sourceUrl, {cache:'no-store'});
    if(!res.ok) throw new Error('تعذر تحميل النسخة الأصلية من GitHub');
    let app = await res.text();

    // Fix expense form field IDs used by addExpense()
    app = app
      .replaceAll("getElementById('exCategory')", "getElementById('expCategory')")
      .replaceAll("getElementById('exAmount')", "getElementById('expAmount')")
      .replaceAll("getElementById('exDate')", "getElementById('expDate')")
      .replaceAll("getElementById('exNotes')", "getElementById('expNotes')")
      .replaceAll('>v87</span>', '>v88</span>');

    document.open();
    document.write(app);
    document.close();
  }catch(e){
    document.getElementById('err').textContent = e && e.message ? e.message : 'حدث خطأ غير متوقع';
  }
})();
</script>
</body>
</html>
